# Local Postgres for the v0.2 schema.
# Do not apply this schema to the live Supabase project (3-table MVP).
services:
  postgres:
    image: postgres:16
    container_name: rnj-dev-postgres
    environment:
      POSTGRES_USER: rnj
      POSTGRES_PASSWORD: rnj
      POSTGRES_DB: rnj_dev
    ports:
      - "5432:5432"
    volumes:
      - rnj_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnj -d rnj_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rnj_pg_data:
